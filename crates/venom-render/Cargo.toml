[package]
name = "venom-render"
description = "Rendering abstraction layer for VenomUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["software", "text"]
software = ["tiny-skia"]
text = ["cosmic-text"]

[dependencies]
venom-core = { path = "../venom-core" }
tiny-skia = { version = "0.11", optional = true }
cosmic-text = { version = "0.12", optional = true }
rustc-hash = "2.0"

[dev-dependencies]
